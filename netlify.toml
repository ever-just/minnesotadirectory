[build]
  command = "npm run prebuild && npm run build && node scripts/optimize-deploy.mjs"
  functions = "netlify/functions"  
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  DATABASE_URL = "postgresql://USER:PASSWORD@HOST/DB  # moved to Netlify env vars 2026-09-04"
  GOOGLE_PLACES_API_KEY = "GOOGLE_API_KEY_REMOVED"
  GOOGLE_MAPS_API_KEY = "GOOGLE_API_KEY_REMOVED"
  JWT_SECRET = "your-super-secret-jwt-key-change-in-production"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NETLIFY_USE_YARN = "false"
  NETLIFY_USE_PNPM = "true"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/**"]

[dev]
  command = "npm run dev:vite"
  port = 8888
  publish = "dist"
  functions = "netlify/functions"

# Environment variables (will be injected from Netlify dashboard)
[context.production.environment]
  NODE_ENV = "production"

[context.dev.environment] 
  NODE_ENV = "development"

